<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Employer Dashboard | HireConnect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="dashboard-style.css" />
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Header -->
    <header class="dashboard-header">
      <div class="brand">
        <i class="fa-solid fa-briefcase"></i>
        <span>HireConnect</span>
      </div>
      <div class="user-profile">
        <div class="avatar">UN</div>
        <span>Username</span>
      </div>
    </header>

    <!-- Welcome Section -->
    <section class="welcome-banner">
      <h2>Employer Management Hub</h2>
      <p>Select an action below to manage your recruitment process.</p>

    <!-- Navigation Action Cards -->
    <main class="action-grid">
      <a href="post-job.html" class="action-card">
        <div class="card-icon icon-blue">

        </div>

      <a href="view.php" class="action-card">
        <div class="card-icon icon-dark">

        </div>

          <p>Access your database to review candidate profiles and application statuses.</p>
        </div>
        <i class="fa-solid fa-arrow-right card-arrow"></i>
      </a>
